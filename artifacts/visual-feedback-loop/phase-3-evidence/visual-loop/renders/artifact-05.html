<!doctype html><html><head><meta charset="utf-8"><title>Field Notes</title><style>
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:#f1f5f9;color:#0f172a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
#page{width:100vw;height:100vh;padding:48px;display:flex;flex-direction:column;max-width:1280px;margin:0 auto}
#header{height:120px;flex:0 0 auto;background:#0f172a;color:#ffffff;
  border-radius:16px;padding:24px 32px;display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 8px 24px rgba(15,23,42,.18)}
#header h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
#header p{margin:6px 0 0;font-size:16px;color:#94a3b8;line-height:1.4}
#cards{display:flex;flex-direction:row;flex-wrap:nowrap;gap:24px;height:220px;margin-top:32px}
.card{flex:1 1 0;min-width:0;height:220px;background:#ffffff;padding:28px 32px;
  border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.06);
  display:flex;flex-direction:column;justify-content:center}
.card h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:#64748b}
.card .value{margin:6px 0 0;font-size:52px;font-weight:700;line-height:1;letter-spacing:-1.5px;color:#0f172a}
.card p:not(.value){margin:12px 0 0;font-size:14px;color:#94a3b8}
#footer{margin-top:auto;padding-top:20px;font-size:14px;color:#64748b;border-top:1px solid #e2e8f0}
</style></head><body><main id="page"><header id="header"><h1>Field Notes</h1><p>Weekly project overview</p></header>
<section id="cards"><article class="card" id="card-1"><h2>Active projects</h2><p class="value">12</p><p>Across all teams</p></article>
<article class="card" id="card-2"><h2>Tasks completed</h2><p class="value">84</p><p>This week</p></article>
<article class="card" id="card-3"><h2>Team members</h2><p class="value">24</p><p>Working together</p></article></section>
<footer id="footer">Updated today · All systems operational</footer></main></body></html>
