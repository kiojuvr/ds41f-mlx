<!doctype html><html><head><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#f1f5f9;color:#0f172a;font-family:"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#page{width:1280px;height:720px;padding:48px;overflow:hidden}
#header{width:1184px;height:120px;background:#0f172a;color:#ffffff;padding:24px 32px;border-radius:16px;display:flex;flex-direction:column;justify-content:center}
h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-0.5px;line-height:1.15}
#header p{margin:6px 0 0;font-size:15px;color:#cbd5e1;line-height:1.3}
#cards{display:flex;flex-direction:row;gap:24px;margin-top:32px}
.card{flex:1 1 0;min-width:0;height:220px;background:#ffffff;padding:24px;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(15,23,42,.06);display:flex;flex-direction:column}
h2{margin:0;font-size:15px;font-weight:600;color:#475569;letter-spacing:.02em;text-transform:uppercase}
.value{font-size:44px;font-weight:700;margin:12px 0 0;color:#0f172a;line-height:1.1}
.card p:last-child{margin:auto 0 0;font-size:14px;color:#64748b}
#footer{margin-top:28px;font-size:14px;color:#64748b}
</style></head><body><main id="page"><header id="header"><h1>Field Notes</h1><p>Weekly project overview</p></header>
<section id="cards"><article class="card" id="card-1"><h2>Active projects</h2><p class="value">12</p><p>Across all teams</p></article>
<article class="card" id="card-2"><h2>Tasks completed</h2><p class="value">84</p><p>This week</p></article>
<article class="card" id="card-3"><h2>Team members</h2><p class="value">24</p><p>Working together</p></article></section>
<footer id="footer">Updated today · All systems operational</footer></main></body></html>
