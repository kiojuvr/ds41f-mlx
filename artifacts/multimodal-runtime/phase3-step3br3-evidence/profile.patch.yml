- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    baseURL: http://127.0.0.1:18083
    apiKeyEnv: DS41F_LOCAL_API_KEY
    maxImagesPerRequest: 3
    imageOffloadCountQuantum: 1
    thinking: disabled
    reasoningEffort: off
    maxTokens: 1200
    streamIdleTimeoutMs: 180000
    models:
      - id: deepseek-flash
        inputModalities: [text, image]
        contextWindow: 1048576
        maxTokens: 1200
        systemPromptUpdate: in-history
        toolUpdate: addition-only
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
- id: session-log-deepseek
  config:
    enabled: false
- id: tool-fs
  config:
    read: false
    readImage: true
    write: false
    edit: false
- id: tools
  config:
    mode: native
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: /var/folders/jk/0kx3l0t93zj6gwlgth99c6lc0000gn/T/ds41f-step3br3-session-cv9vjc12/workspace
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
    defaultPreset: read-only
